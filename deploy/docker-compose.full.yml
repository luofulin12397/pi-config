# ─────────────────────────────────────────────────────────────────────────────
# 完整栈：4 个数据服务 + 2 个应用服务（一键部署到新机器）
#
#   cp .env.example .env && vi .env          # 至少填 API Key、JWT_SECRET_KEY、PUBLIC_HOST
#   docker compose -f deploy/docker-compose.full.yml up -d --build
#   open http://<服务器IP>:55001/console/
#
# 与 deploy/docker-compose.yml（只跑数据服务、供宿主机 uv run 调试用）的区别：
#   本文件额外跑应用容器，并把容器内网络地址改成服务名（mongo / milvus / minio）
# 注意：两者端口相同，不要在同一台机器同时启动
# ─────────────────────────────────────────────────────────────────────────────
name: rag-full

# 应用服务公共配置（YAML 锚点，两个服务共用同一镜像）
x-app-base: &app-base
  build:
    context: ..
    args:
      SLIM: "1"
      # 国内网络构建可打开镜像源
      # UV_DEFAULT_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
  image: rag-app:local
  restart: unless-stopped
  env_file:
    - ../.env
  # 让容器能用 host.docker.internal 访问宿主机（MinIO 图片地址用）
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    mongo:
      condition: service_healthy
    milvus:
      condition: service_started
    minio:
      condition: service_healthy

services:
  # ── 数据服务 ───────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: rag-mongo
    ports:
      - "27017:27017"
    volumes:
      - rag-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: rag-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - rag-etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: rag-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rag-minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: rag-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_BUCKET_NAME: milvus-bucket
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - rag-milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  # ── 应用服务（同一镜像，不同入口）──────────────────────────────────────────
  import-service:
    <<: *app-base
    container_name: rag-import
    command: ["uvicorn", "app.api.http.import_server:app", "--host", "0.0.0.0", "--port", "55000"]
    ports:
      - "55000:55000"
    environment:
      # 容器内网络：宿主机的 127.0.0.1 要用服务名替换
      MONGO_URL: mongodb://mongo:27017
      MILVUS_URL: http://milvus:19530
      # MinIO 地址会拼进图片 URL 交给浏览器，必须是浏览器可达的地址
      MINIO_ENDPOINT: ${PUBLIC_HOST:-host.docker.internal}:9000
      REDIS_URL: ""
    volumes:
      - ../output:/app/output
      - ../logs:/app/logs

  query-service:
    <<: *app-base
    container_name: rag-query
    command: ["uvicorn", "app.api.http.query_server:app", "--host", "0.0.0.0", "--port", "55001"]
    ports:
      - "55001:55001"
    environment:
      MONGO_URL: mongodb://mongo:27017
      MILVUS_URL: http://milvus:19530
      MINIO_ENDPOINT: ${PUBLIC_HOST:-host.docker.internal}:9000
      REDIS_URL: ""
    volumes:
      - ../output:/app/output
      - ../logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:55001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  rag-mongo-data:
  rag-etcd-data:
  rag-minio-data:
  rag-milvus-data:
