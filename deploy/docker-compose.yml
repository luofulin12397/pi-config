# 联调环境：MongoDB + Milvus standalone（etcd + minio）—— 项目 MinIO 共用 milvus-minio（bucket: enterprise-rag）
services:
  mongo:
    image: mongo:7
    container_name: rag-mongo
    ports: ["27017:27017"]
    volumes: ["rag-mongo-data:/data/db"]
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: rag-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: ["rag-etcd-data:/etcd"]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: rag-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: ["rag-minio-data:/minio_data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: rag-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_BUCKET_NAME: milvus-bucket
    ports: ["19530:19530", "9091:9091"]
    volumes: ["rag-milvus-data:/var/lib/milvus"]
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

volumes:
  rag-mongo-data:
  rag-etcd-data:
  rag-minio-data:
  rag-milvus-data:
